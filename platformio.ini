; Development project for the library itself.
;   pio test -e native        host unit tests (ASan + UBSan)
;   scripts/build_examples.sh every example on every target (Arduino + ESP-IDF)
; Applications do not use this file: they add the library through lib_deps,
; the Arduino Library Manager, or as an ESP-IDF component.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -I test/support
    -DVL_LOG_LEVEL=4
    -fsanitize=address,undefined
    -fno-sanitize-recover=all
    -fno-omit-frame-pointer
    -g
build_src_flags =
    -std=gnu++11
    -Wall
    -Wextra
    -Werror
extra_scripts = scripts/sanitize_link.py
